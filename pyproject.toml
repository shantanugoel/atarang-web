[project]
name = "atarang-platform"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/acquisition", "services/worker", "bench/separation"]

[tool.uv]
# aarch64 is here so the images build on ARM hardware — a Raspberry Pi host, or
# any arm64 runner. The lock carries wheels for both; nothing else changes.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/acquisition/tests", "services/worker/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
