[project]
name = "atarang-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/acquisition", "services/worker", "bench/separation"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/worker/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
