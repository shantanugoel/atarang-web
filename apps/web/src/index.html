<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale, because iOS Safari ignores user-scalable but honours it:
         pinch-zooming a fixed full-height app strands the transport off-screen,
         and focusing an 11px select zooms the page in on its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Atarang — a local-first music practice studio." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Inline, because without any icon every browser asks for /favicon.ico and
         gets a 404 that lands in the console of every page. Same mark as
         src/assets/icon.svg, which is where the installed-app PNGs come from. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237367f3'/%3E%3Cpath d='M13 8.5 22 6.6v11.6a3.1 3.1 0 1 1-2-2.9V11l-5 1.1v8.6a3.1 3.1 0 1 1-2-2.9z' fill='%23fff'/%3E%3C/svg%3E" />
    <!-- No apple-touch-icon link: iOS ignores the manifest's icons and probes
         /apple-touch-icon.png at the site root, which the build writes. A link
         here would be resolved and hashed by the bundler, which is one more copy
         of the same 1.5 KB for no gain. -->
    <title>Atarang Studio</title>
    <script type="module" src="./main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
