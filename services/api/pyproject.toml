[project]
name = "atarang-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "sqlalchemy==2.0.51",
  "psycopg[binary]==3.3.4",
  "alembic==1.18.5",
  "boto3==1.43.53",
  "python-multipart==0.0.20",
  "argon2-cffi==25.1.0",
]

[project.scripts]
atarang-cleanup = "atarang_api.cleanup:run"

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.12.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atarang_api"]
