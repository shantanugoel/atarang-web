[project]
name = "atarang-worker"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "atarang-api",
  "demucs==4.1.0",
  "numpy==1.26.4",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchaudio==2.8.0"]
# The cu128 index publishes no aarch64 wheels, so without this marker the lock
# is unsolvable on ARM even though nothing on an ARM host would ever ask for
# CUDA. Empty on aarch64 is the honest answer: there is no CUDA build there.
cuda = [
  "torch==2.8.0; platform_machine == 'x86_64'",
  "torchaudio==2.8.0; platform_machine == 'x86_64'",
]

[project.scripts]
atarang-worker = "atarang_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atarang_worker"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
atarang-api = { workspace = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
