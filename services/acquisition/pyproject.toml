[project]
name = "atarang-acquisition"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "atarang-api",
  "yt-dlp[default]==2026.7.4",
]

[project.scripts]
atarang-acquisition = "atarang_acquisition.main:run"
atarang-youtube = "atarang_acquisition.ephemeral:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atarang_acquisition"]

[tool.uv.sources]
atarang-api = { workspace = true }
