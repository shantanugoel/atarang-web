# The frontend is hosted somewhere else — a static host serving `bun run build`
# output — and this deployment is the API alone.
#
# Two things change, and they are the same change seen from both ends. Caddy
# stops carrying the bundle and becomes only the /api/* reverse proxy, so the
# image is built from the `proxy` target and skips the web build entirely. And
# the app is now cross-origin, so PUBLIC_ORIGIN is no longer a formality that
# can default to localhost: it is the single origin the API's CORS allows, and
# a wrong value fails the frontend's capability probe with no visible error
# beyond the cloud surfaces staying hidden. Required here rather than defaulted,
# because there is no sensible default for someone else's frontend.
#
#   docker compose -f compose.yaml -f compose.backend-only.yaml up -d --build
services:
  caddy:
    build:
      target: proxy

  api:
    environment:
      ATARANG_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the frontend origin, e.g. https://atarang.app}
