name: atarang-youtube

# One container, no database, no object store. It fetches a video's audio, holds
# it in a tmpfs long enough for the browser to collect it, and forgets it. The
# browser separates the stems locally, so nothing here needs a worker either.
# The full stack — cached sources, server-side separation, jobs that survive a
# restart — is compose.yaml.

services:
  youtube:
    build:
      context: .
      dockerfile: infra/images/acquisition.Dockerfile
    command: [atarang-youtube]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    expose:
      - "8000"
    environment:
      ATARANG_DEPLOYMENT_KEY: ${DEPLOYMENT_KEY:?set DEPLOYMENT_KEY}
      # The origin of the page that calls this, not this deployment's own
      # address. It is the only origin CORS allows, and a wrong value fails the
      # frontend's capability probe with nothing visible but the YouTube panel
      # staying hidden.
      ATARANG_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the origin of the frontend, e.g. https://atarang.app}
    read_only: true
    tmpfs:
      # Holds the downloaded mp3 and yt-dlp's scratch; sized for the longest
      # video the duration limit allows, times the two concurrent fetches.
      - /tmp:size=2G,uid=10003,gid=10003,mode=0700
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 8
