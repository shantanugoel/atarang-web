name: atarang

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  pids_limit: 256
  networks: [control]

services:
  caddy:
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    build:
      context: ../..
      dockerfile: infra/images/web.Dockerfile
    ports: ["${HOST_HTTP_PORT:-4173}:80"]
    networks: [edge, control]
    environment:
      ATARANG_SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}

  api:
    <<: *hardened
    build:
      context: ../..
      dockerfile: infra/images/api.Dockerfile
    environment:
      ATARANG_DATABASE_URL: postgresql+psycopg://atarang:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/atarang
      ATARANG_DEPLOYMENT_KEY: ${DEPLOYMENT_KEY:?set DEPLOYMENT_KEY}
      ATARANG_OBJECT_BACKEND: s3
      ATARANG_S3_ENDPOINT_URL: http://object:9000
      ATARANG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      ATARANG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ATARANG_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ATARANG_YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-false}
      ATARANG_YOUTUBE_ACQUISITION_COMPILED: "true"
    tmpfs: ["/tmp:size=64M,uid=10001,gid=10001,mode=0700"]
    depends_on:
      postgres: {condition: service_healthy}
      object: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 8

  cleanup:
    <<: *hardened
    build:
      context: ../..
      dockerfile: infra/images/api.Dockerfile
    environment:
      ATARANG_DATABASE_URL: postgresql+psycopg://atarang:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/atarang
      ATARANG_OBJECT_BACKEND: s3
      ATARANG_S3_ENDPOINT_URL: http://object:9000
      ATARANG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      ATARANG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: [sh, -c, "while true; do atarang-cleanup; sleep 3600; done"]
    tmpfs: ["/tmp:size=64M,mode=1777"]
    depends_on:
      api: {condition: service_healthy}

  acquisition:
    <<: *hardened
    build:
      context: ../..
      dockerfile: infra/images/acquisition.Dockerfile
    environment:
      ATARANG_DATABASE_URL: postgresql+psycopg://atarang:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/atarang
      ATARANG_OBJECT_BACKEND: s3
      ATARANG_S3_ENDPOINT_URL: http://object:9000
      ATARANG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      ATARANG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ATARANG_YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-false}
      ATARANG_YOUTUBE_ACQUISITION_COMPILED: "true"
    networks: [control, acquisition-egress]
    tmpfs: ["/tmp:size=2G,uid=10003,gid=10003,mode=0700"]
    depends_on:
      api: {condition: service_healthy}

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atarang
      POSTGRES_USER: atarang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atarang -d atarang"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt: [no-new-privileges:true]

  object:
    build:
      context: ../..
      dockerfile: infra/images/object.Dockerfile
    command: [server, /data]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [object-data:/data]
    networks: [control]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  edge:
  control:
    internal: true
  acquisition-egress:

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:
