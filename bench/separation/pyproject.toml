[project]
name = "atarang-separation-bench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["atarang-worker"]

[project.scripts]
atarang-bench = "atarang_bench.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atarang_bench"]

[tool.uv.sources]
atarang-worker = { workspace = true }
